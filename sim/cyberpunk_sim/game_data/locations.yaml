- id: fixer_office_18
  name: Blackwood's Office
  description: A back room behind a legitimate front — could be a bar, a laundromat,
    a ripperdoc's. Desk, terminal, two chairs. The screen is angled so only the fixer
    can see it. The invisible infrastructure of Night City's real economy. Every job,
    every merc, every corpo hit and data steal runs through a room like this.
  sensory:
    sight: A back room behind a legitimate front — could be a bar, a laundromat, a
      ripperdoc's. Desk, terminal, two chairs. The screen is angled so only the fixer
      can see it.
    sound: The soft click of encrypted comms connecting. The fixer's voice — calm,
      measured, every word chosen. A terminal notification chiming — new job, new
      opportunity, new body count.
    smell: Money. Not a literal smell — the metaphorical weight of eddies flowing
      through this room, the invisible scent of transactions that shape the district.
    touch: Handshake — firm, brief, sealing. The drink poured for you is cold, smooth,
      a gesture that means you're worth the good stuff. Or that the job is bad enough
      to need it.
  atmosphere: The invisible infrastructure of Night City's real economy. Every job,
    every merc, every corpo hit and data steal runs through a room like this.
