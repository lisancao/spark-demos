- id: braindance_parlor_5
  name: The Razor Experience
  description: Soft purple lighting, designed to relax. A customer in a chair, completely
    still, visor on, body twitching — they're someone else right now. A technician
    wiping down a headset with antiseptic. Addiction dressed up as recreation. The
    regulars come every day. Their eyes get that flat look — the real world doesn't
    render at high enough resolution anymore.
  sensory:
    sight: Soft purple lighting, designed to relax. A customer in a chair, completely
      still, visor on, body twitching — they're someone else right now. A technician
      wiping down a headset with antiseptic.
    sound: The electromagnetic whine of headsets at full immersion. Breathing — deep,
      slow, synchronized across a dozen customers. The soft chime of a session ending.
    smell: Antiseptic on the headsets, that hospital-clean smell. The synthetic leather
      of the chairs. Air freshener — lavender, pumped through the vents to keep people
      calm.
    touch: Coming out is the worst part. The visor lifts and suddenly you have a body
      again — heavy, clumsy, yours. The chair is too firm. The air is too cold. Reality
      is a downgrade.
  atmosphere: Addiction dressed up as recreation. The regulars come every day. Their
    eyes get that flat look — the real world doesn't render at high enough resolution
    anymore.
