- id: ripperdoc_clinic_3
  name: Nguyen's Clinic
  description: Antiseptic tiles, half of them chipped. A fridge humming in the corner
    — you don't want to know what's inside. Bioscanners blinking green on a tray.
    You walk in meat. You walk out better. Or worse. Or you don't walk out. The waiver
    you signed covers all three.
  sensory:
    sight: Antiseptic tiles, half of them chipped. A fridge humming in the corner
      — you don't want to know what's inside. Bioscanners blinking green on a tray.
    sound: Bioscanners pinging. The hiss of local anesthetic spraying. Someone in
      the recovery cot groaning as the new chrome handshakes with their nervous system.
    smell: Rubbing alcohol, synthetic skin adhesive, and the copper-sweet smell of
      someone who's been opened up. Coffee, because the doc's been at it fourteen
      hours.
    touch: The doc's chrome fingers on your jaw, precise and cold. The pinch of the
      neural jack going in. Then nothing, then everything, then you're someone with
      new parts.
  atmosphere: You walk in meat. You walk out better. Or worse. Or you don't walk out.
    The waiver you signed covers all three.
