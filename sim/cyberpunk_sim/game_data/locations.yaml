- id: food_stall_1
  name: The Bloody Bowl
  description: Plastic tarps for walls, fairy lights strung between poles. Menu handwritten
    on a board, half in Japanese, half in English, prices in eddies. A cat sleeping
    on a crate of synth-noodles. Neutral ground by unspoken law. Gangers eat next
    to corpos eat next to cops. The food doesn't care who you are. Neither does the
    cook.
  sensory:
    sight: Plastic tarps for walls, fairy lights strung between poles. Menu handwritten
      on a board, half in Japanese, half in English, prices in eddies. A cat sleeping
      on a crate of synth-noodles.
    sound: The hiss of steam. Chopsticks clicking on ceramic. A customer's holo ringing,
      ignored in favor of noodles. Street noise — traffic, voices, a siren wailing
      somewhere.
    smell: Broth — real soy, real ginger, real garlic, or close enough that your tongue
      can't tell. Frying oil that's been used all day, dark and fragrant. Chili paste,
      eye-watering, on the counter.
    touch: Steam on your face, opening your pores. Your hands wrapped around the bowl.
      For five minutes, Night City shrinks to the size of this counter and the food
      in front of you.
  atmosphere: Neutral ground by unspoken law. Gangers eat next to corpos eat next
    to cops. The food doesn't care who you are. Neither does the cook.
