- id: combat_zone_7
  name: The Toxic Zone
  description: Burned-out buildings, rebar jutting from concrete like broken bones.
    A Militech APC rusting on its side, tires gone, stripped to the frame. Somebody's
    living in it. The city tried to build something here once. Now it's a monument
    to the gap between what Night City promises and what it delivers.
  sensory:
    sight: Burned-out buildings, rebar jutting from concrete like broken bones. A
      Militech APC rusting on its side, tires gone, stripped to the frame. Somebody's
      living in it.
    sound: Gunfire — distant, sporadic, the background noise of a place with no law.
      A generator coughing somewhere. Dogs, feral, fighting over something you don't
      want to see.
    smell: Rust, mold, wet earth where the pavement's cracked open. The sharp clean
      smell of rain on rubble, which is the only clean thing here.
    touch: The ground is uneven. Your ankle turns on broken concrete. The cover you're
      crouching behind is a car door and it won't stop anything bigger than a pistol
      round.
  atmosphere: The city tried to build something here once. Now it's a monument to
    the gap between what Night City promises and what it delivers.
