- id: food_stall_19
  name: Street Pulse
  description: Steam rising from a vat of broth, lit neon-orange by the sign above.
    A counter with six stools, three occupied. The cook working fast — chopping, stirring,
    plating — chrome hands a blur. This is where the solos come after a job. Where
    the fixers close deals over dumplings. Where everybody is just a person with a
    bowl and a pair of chopsticks.
