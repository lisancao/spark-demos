- id: nomad_camp_11
  name: The Razor Convoy
  description: Mechanic under a truck, legs sticking out. A rifle leaning on every
    third vehicle. A woman on watch, silhouetted against the sunset, scanning the
    horizon with enhanced optics. The road is home. The camp is temporary. The people
    are permanent. That's the deal.
  sensory:
    sight: Mechanic under a truck, legs sticking out. A rifle leaning on every third
      vehicle. A woman on watch, silhouetted against the sunset, scanning the horizon
      with enhanced optics.
    sound: Wind — constant, dry, carrying sand that ticks against metal. Radio chatter
      between outriders. A dog barking at a dust devil.
    smell: Leather, sweat, motor oil, and the open-air smell that city people forget
      exists. No synthetics. No recycled air. Just sky.
    touch: The truck hood is warm from the sun, even after dark. The camp chair canvas
      sags under you. Solid ground, real ground, not concrete.
  atmosphere: The road is home. The camp is temporary. The people are permanent. That's
    the deal.
