- id: nightclub_2
  name: Kowalski's
  description: Holographic dancers flickering between the real ones. A bouncer by
    the VIP rope — his arms are Gorilla Arms, you can tell by the seams at the shoulders.
    Someone's nose is bleeding at the bar. Nobody's helping. Neon and bass and the
    beautiful lie that tonight doesn't have consequences. It does. It always does.
  sensory:
    sight: Holographic dancers flickering between the real ones. A bouncer by the
      VIP rope — his arms are Gorilla Arms, you can tell by the seams at the shoulders.
      Someone's nose is bleeding at the bar. Nobody's helping.
    sound: Muffled conversation from VIP — corpo accents, clipped and precise. Someone
      retching in the bathroom. The airlock-hiss of a booth curtain closing.
    smell: Synth-alcohol sweat, ozone from the light rigs, perfume that costs more
      than a month's rent in Watson. Underneath it all, the meat smell of too many
      bodies.
    touch: Drink cold in your hand. Condensation dripping down the glass. The air
      is ten degrees too hot and humid with exhalation.
  atmosphere: Neon and bass and the beautiful lie that tonight doesn't have consequences.
    It does. It always does.
