- id: corpo_tower_17
  name: Tanaka Industries
  description: Glass and steel rising sixty floors, cutting the skyline like a blade.
    Lobby floor polished to a mirror — your reflection walks toward you, smaller.
    Reception desk staffed by someone whose smile is contractually obligated. Arasaka,
    Militech, Kang Tao — the name changes, the tower doesn't. Glass and steel and
    the quiet violence of people who destroy lives with a memo.
  sensory:
    sight: Glass and steel rising sixty floors, cutting the skyline like a blade.
      Lobby floor polished to a mirror — your reflection walks toward you, smaller.
      Reception desk staffed by someone whose smile is contractually obligated.
    sound: Security comms crackling in earpieces. The whisper-click of mag-locked
      doors. Somewhere, a phone ringing once before being answered by someone paid
      to answer on the first ring.
    smell: Coffee that costs forty eddies a cup. Fresh-cut flowers replaced daily
      — lilies, always lilies, because someone decided lilies say 'power.' Dry-cleaned
      fabric.
    touch: Marble floor, cold through your shoes. The elevator rail is brushed steel,
      body-temperature from the climate control. Your visitor badge is thin plastic
      with a tracker in it.
  atmosphere: Arasaka, Militech, Kang Tao — the name changes, the tower doesn't. Glass
    and steel and the quiet violence of people who destroy lives with a memo.
