- id: megabuilding_4
  name: The Rusted Stack
  description: Forty stories of stacked humanity. Laundry lines between balconies.
    Neon advertisements bleeding through windows that don't open. Vertical slum with
    a corporate logo on the lobby. Two thousand people living in a building that hates
    them.
  sensory:
    sight: Forty stories of stacked humanity. Laundry lines between balconies. Neon
      advertisements bleeding through windows that don't open.
    sound: HVAC rattling like a dying animal. Footsteps above, below, beside you.
      A baby crying in a language you don't speak.
    smell: Synthetic ramen steam, piss in the stairwell, ozone from a busted power
      junction. Somebody's cooking real meat — you can tell because it smells wrong
      after years of synth.
    touch: The hallway wall is damp. The elevator button sticks. Your shoes leave
      prints on whatever's coating the floor.
  atmosphere: Vertical slum with a corporate logo on the lobby. Two thousand people
    living in a building that hates them.
