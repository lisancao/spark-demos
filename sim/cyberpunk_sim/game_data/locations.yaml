- id: chop_shop_14
  name: Parts & Labor
  description: Cyberware in jars on a shelf — arms, optic assemblies, a spinal column
    shining chrome under fluorescent light. A workbench covered in tools and blood.
    A drain in the floor. Stolen cars in, clean parts out. Or stolen chrome in, sanitized
    implants out. Same business model, different inventory.
  sensory:
    sight: Cyberware in jars on a shelf — arms, optic assemblies, a spinal column
      shining chrome under fluorescent light. A workbench covered in tools and blood.
      A drain in the floor.
    sound: An engine revving — testing, not running. The pop-pop of spot welds. A
      compressor cycling on and off like a mechanical heartbeat.
    smell: 'Grease, cutting fluid, hot metal, burned rubber. The tang of battery acid
      from a pile of used power cells. Underneath: the antiseptic smell of cyberware
      being prepped.'
    touch: Concrete floor, cracked and oil-stained. The lift hydraulics shudder when
      they hold. Your feet stick to whatever's coating the ground near the drain.
  atmosphere: Stolen cars in, clean parts out. Or stolen chrome in, sanitized implants
    out. Same business model, different inventory.
