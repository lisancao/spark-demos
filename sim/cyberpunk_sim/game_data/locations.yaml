- id: combat_zone_6
  name: Reyes's Ruin
  description: Bullet holes in everything. Scorch marks from incendiary grenades.
    A market set up in a parking garage — tarps, car batteries, people with guns visible.
    Every building is a potential ambush. Every person is a potential threat. Paranoia
    isn't a disorder here — it's a survival skill.
  sensory:
    sight: Bullet holes in everything. Scorch marks from incendiary grenades. A market
      set up in a parking garage — tarps, car batteries, people with guns visible.
    sound: Wind through broken windows, a sound like breathing. Rubble shifting —
      rats or people, same survival instinct. An explosion, far enough to not worry
      about. Yet.
    smell: Burned plastic and the acrid tang of a chemical fire that went out days
      ago. Human waste. Cooking smoke from a camp you can't see.
    touch: The ground is uneven. Your ankle turns on broken concrete. The cover you're
      crouching behind is a car door and it won't stop anything bigger than a pistol
      round.
  atmosphere: Every building is a potential ambush. Every person is a potential threat.
    Paranoia isn't a disorder here — it's a survival skill.
