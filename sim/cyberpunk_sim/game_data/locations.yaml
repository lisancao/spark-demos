locations:
- id: megabuilding_0
  name: Chen Tower
  description: Corridor lights flicker between yellow and dead. Apartment doors every
    six feet, half of them dented. Vending machines casting blue glow on concrete
    walls. The kind of place where nobody asks questions because they already know
    the answers and the answers are all bad.
  sensory:
    sight: Corridor lights flicker between yellow and dead. Apartment doors every
      six feet, half of them dented. Vending machines casting blue glow on concrete
      walls.
    sound: HVAC rattling like a dying animal. Footsteps above, below, beside you.
      A baby crying in a language you don't speak.
    smell: Recycled air that's been through ten thousand lungs. Disinfectant that
      doesn't disinfect. The chemical sweetness of a vending machine meal.
    touch: Handrail greasy under your palm. The apartment door is thin enough to punch
      through. You don't, because the lock is the only thing between you and everything.
  atmosphere: The kind of place where nobody asks questions because they already know
    the answers and the answers are all bad.
