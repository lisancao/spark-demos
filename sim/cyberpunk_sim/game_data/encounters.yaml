  description: Something happens at Kowalski's.
  consequences: []
  tone_direction: Quiet and lethal. The hack is silent — fingers of code sliding through
    security layers, each one a trap waiting to spring. One wrong move and the ICE
    fries your neural link. With your brain attached.
