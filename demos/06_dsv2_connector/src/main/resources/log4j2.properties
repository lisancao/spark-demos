# Keeps the demo output readable.
#
# Spark ships its own log4j2-defaults.properties which logs at INFO, printing about
# forty lines before a demo prints anything. Because target/classes comes first on
# the classpath, this file wins and Spark's default is never loaded.
#
# Set rootLogger.level to info if you want to watch what Spark is doing.
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Spark logs a JDK-internals warning on 17+ that the --add-opens flags already handle.
logger.hadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop.level = error
