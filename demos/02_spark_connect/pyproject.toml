[project]
name = "spark-connect-demo"
version = "0.1.0"
description = "Spark 4.2 Spark Connect demo — thin client, same DataFrame code, embed in an AI tool"
requires-python = ">=3.10"
dependencies = [
    # TRUE thin client: pure Python, no jars/, no local JRE.
    # Do NOT use pyspark[connect] here — that ships the full distribution and falsifies the claim.
    "pyspark-client==4.2.0",
    "python-dotenv>=1.0",
    # Pin floor matching Spark 4.2 Connect; keep pandas <3 to avoid FutureWarning noise on camera.
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=18.0.0",
    "grpcio>=1.76.0",
    "grpcio-status>=1.76.0",
    "googleapis-common-protos>=1.71.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = ["ipykernel", "ruff"]

[project.scripts]
spark-connect-demo = "spark_connect_demo.run_demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
package = true
