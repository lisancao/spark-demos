<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="tf2 df2">
  <title id="tf2">The three categories of Project Feather work</title>
  <desc id="df2">Project Feather groups its optimizations into three tracks: query compilation and task scheduling, an Arrow-based df.cache, and shuffle-free execution. The first two are merged and targeted for Spark 4.3. The third is partly merged, with multi-threaded execution over in-process channels still ahead.</desc>
  <style>
    .bg { fill: #fbfcfd; }
    .title { font: 700 27px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1f2933; }
    .card { rx: 10; ry: 10; stroke-width: 1.6; }
    .c1 { fill: #eaf1fb; stroke: #4c78c9; }
    .c2 { fill: #edf6f0; stroke: #4a9668; }
    .c3 { fill: #f6f1f7; stroke: #8a6aa8; }
    .num { font: 700 34px 'Helvetica Neue', Helvetica, Arial, sans-serif; opacity: 0.28; }
    .n1 { fill: #24427e; } .n2 { fill: #2f5a42; } .n3 { fill: #513a66; }
    .h { font: 700 20px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .h1c { fill: #24427e; } .h2c { fill: #2f5a42; } .h3c { fill: #513a66; }
    .item { font: 400 14.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #46505c; }
    .mono { font: 500 13px 'SF Mono', Menlo, Consolas, monospace; fill: #46505c; }
    .badge { rx: 4; ry: 4; }
    .bmerged { fill: #e3f0e8; stroke: #4a9668; stroke-width: 1.1; }
    .bahead { fill: #fdf2e2; stroke: #cf9440; stroke-width: 1.1; }
    .bt { font: 700 11.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .btm { fill: #2f5a42; } .bta { fill: #96661f; }
    .cap { font: 600 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333d47; }
  </style>
  <rect class="bg" width="1200" height="675"/>
  <text class="title" x="60" y="52">Three categories, three risk profiles</text>

  <rect class="card c1" x="60" y="88" width="1080" height="160"/>
  <text class="num n1" x="1096" y="130" text-anchor="end">1</text>
  <text class="h h1c" x="88" y="126">Query compilation and task scheduling</text>
  <rect class="badge bmerged" x="88" y="140" width="196" height="21"/>
  <text class="bt btm" x="186" y="155" text-anchor="middle">MERGED, TARGETS 4.3</text>
  <text class="item" x="88" y="187">Cheaper analysis, optimization, and planning. Less task serialization. Fewer plan traversals.</text>
  <text class="item" x="88" y="211">A one-file scan reports SinglePartition, so Spark skips a shuffle it never needed:</text>
  <text class="mono" x="88" y="234">2 stages, 330 ms   ->   1 stage, 150 ms      (proposal prototype)</text>

  <rect class="card c2" x="60" y="264" width="1080" height="140"/>
  <text class="num n2" x="1096" y="306" text-anchor="end">2</text>
  <text class="h h2c" x="88" y="302">Arrow-based df.cache</text>
  <rect class="badge bmerged" x="88" y="316" width="196" height="21"/>
  <text class="bt btm" x="186" y="331" text-anchor="middle">MERGED, TARGETS 4.3</text>
  <text class="item" x="88" y="363">Store the cache in Apache Arrow instead of Spark's existing in-memory format.</text>
  <text class="item" x="88" y="387">Faster vectorized reads, and a smaller footprint because columnar data compresses better.</text>

  <rect class="card c3" x="60" y="420" width="1080" height="172"/>
  <text class="num n3" x="1096" y="462" text-anchor="end">3</text>
  <text class="h h3c" x="88" y="458">Shuffle-free execution</text>
  <rect class="badge bmerged" x="88" y="472" width="150" height="21"/>
  <text class="bt btm" x="163" y="487" text-anchor="middle">PART 1 MERGED</text>
  <rect class="badge bahead" x="248" y="472" width="150" height="21"/>
  <text class="bt bta" x="323" y="487" text-anchor="middle">PART 2 AHEAD</text>
  <text class="item" x="88" y="519">Part 1: MarkSingleTaskExecution marks small scans so EnsureRequirements elides the shuffle.</text>
  <text class="item" x="88" y="543">Part 2: replace the disk hop with in-process channels on Java virtual threads.</text>
  <text class="mono" x="88" y="568">Task -> Disk -> Task        becomes        Task -> Channel -> Task</text>

  <text class="cap" x="600" y="646" text-anchor="middle">Not a new engine. The SQL and DataFrame APIs do not change.</text>
</svg>
