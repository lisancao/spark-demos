<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="tf1 df1">
  <title id="tf1">Fixed overhead dominates small queries and disappears on large ones</title>
  <desc id="df1">Spark pays a roughly fixed cost per query for planning, task serialization, scheduling, and shuffle. On an hour-long job that cost is invisible. On a query over less than 100 megabytes it is most of the wall clock, which is why queries over small data can take three seconds or more.</desc>
  <style>
    .bg { fill: #fbfcfd; }
    .title { font: 700 27px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1f2933; }
    .lbl { font: 700 17px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #2b3540; }
    .sub { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #5a6470; }
    .ovh { fill: #f6d9d4; stroke: #c46a6a; stroke-width: 1.3; }
    .work { fill: #e3f0e8; stroke: #4a9668; stroke-width: 1.3; }
    .seg { font: 600 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .osegt { fill: #8c3d3d; } .wsegt { fill: #2f5a42; }
    .axis { stroke: #c3ccd6; stroke-width: 1.2; }
    .tick { font: 400 12.5px 'SF Mono', Menlo, Consolas, monospace; fill: #7a838d; }
    .cap { font: 600 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333d47; }
    .keyt { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #46505c; }
  </style>
  <rect class="bg" width="1200" height="675"/>
  <text class="title" x="60" y="52">The same fixed cost, two very different bills</text>

  <rect class="ovh" x="60" y="112" width="26" height="18" rx="3"/>
  <text class="keyt" x="96" y="126">fixed overhead: planning, task serialization, scheduling, shuffle</text>
  <rect class="work" x="640" y="112" width="26" height="18" rx="3"/>
  <text class="keyt" x="676" y="126">actual data work</text>

  <text class="lbl" x="60" y="196">Small query, under 100 MB</text>
  <text class="sub" x="60" y="218">overhead is most of the wall clock</text>
  <rect class="ovh" x="60" y="234" width="620" height="58" rx="5"/>
  <text class="seg osegt" x="370" y="269" text-anchor="middle">overhead</text>
  <rect class="work" x="680" y="234" width="104" height="58" rx="5"/>
  <text class="seg wsegt" x="732" y="269" text-anchor="middle">work</text>

  <text class="lbl" x="60" y="382">Large ETL job</text>
  <text class="sub" x="60" y="404">the same overhead, now a rounding error</text>
  <rect class="ovh" x="60" y="420" width="30" height="58" rx="5"/>
  <rect class="work" x="90" y="420" width="1050" height="58" rx="5"/>
  <text class="seg wsegt" x="615" y="455" text-anchor="middle">work</text>

  <line class="axis" x1="60" y1="524" x2="1140" y2="524"/>
  <text class="tick" x="60" y="546">0</text>
  <text class="tick" x="1140" y="546" text-anchor="end">elapsed time</text>

  <text class="sub" x="60" y="588">Measured on stock Spark 4.2.0 over 5,000 in-memory rows: a filter and sort takes 191 ms and</text>
  <text class="sub" x="60" y="610">still plans one shuffle. SELECT 1, with no data at all, takes 20 ms.</text>

  <text class="cap" x="600" y="652" text-anchor="middle">Project Feather removes the cost that small data cannot amortize.</text>
</svg>
