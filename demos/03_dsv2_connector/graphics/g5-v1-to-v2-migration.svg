<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t5 d5">
  <title id="t5">Mapping a DataSource V1 connector onto DataSource V2</title>
  <desc id="d5">RelationProvider becomes TableProvider, BaseRelation becomes Table, buildScan returning an RDD becomes the ScanBuilder to Scan to Batch to PartitionReader chain, PrunedScan and PrunedFilteredScan become the SupportsPushDownRequiredColumns and SupportsPushDownFilters mix-ins, unhandledFilters folds into the return value of pushFilters, and InsertableRelation.insert becomes the WriteBuilder to BatchWrite two-phase commit. DSV2 additionally provides catalogs, row-level DML, CDC, and transactions, which have no V1 equivalent.</desc>
  <style>
    .bg { fill: #fbfcfd; }
    .title { font: 700 27px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1f2933; }
    .colh { font: 700 17px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .v1h { fill: #8a6a3d; } .v2h { fill: #2f5a42; }
    .v1 { fill: #fdf6ec; stroke: #cfa96a; stroke-width: 1.3; rx: 6; ry: 6; }
    .v2 { fill: #eef7f1; stroke: #6aa887; stroke-width: 1.3; rx: 6; ry: 6; }
    .new { fill: #eaf1fb; stroke: #4c78c9; stroke-width: 1.6; rx: 6; ry: 6; }
    .m { font: 600 13.5px 'SF Mono', Menlo, Consolas, monospace; fill: #2b3540; }
    .ms { font: 500 12px 'SF Mono', Menlo, Consolas, monospace; fill: #46505c; }
    .arw { stroke: #9aa5b1; stroke-width: 1.6; fill: none; }
    .note { font: 400 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #5a6470; }
    .newt { font: 700 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #24427e; }
    .cap { font: 600 17px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333d47; }
  </style>
  <rect class="bg" width="1200" height="675"/>
  <text class="title" x="60" y="48">Porting a connector: V1 concept to V2 equivalent</text>

  <text class="colh v1h" x="60" y="86">DataSource V1</text>
  <text class="colh v2h" x="660" y="86">DataSource V2</text>

  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect class="v1" x="60" y="100" width="470" height="40"/>
  <text class="m" x="76" y="126">RelationProvider</text>
  <path class="arw" d="M 536 120 L 654 120" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="100" width="480" height="40"/>
  <text class="m" x="676" y="126">TableProvider</text>

  <rect class="v1" x="60" y="150" width="470" height="40"/>
  <text class="m" x="76" y="176">BaseRelation (abstract class, needs SQLContext)</text>
  <path class="arw" d="M 536 170 L 654 170" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="150" width="480" height="40"/>
  <text class="m" x="676" y="176">Table (interface)</text>

  <rect class="v1" x="60" y="200" width="470" height="40"/>
  <text class="m" x="76" y="226">schema()</text>
  <path class="arw" d="M 536 220 L 654 220" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="200" width="480" height="40"/>
  <text class="m" x="676" y="221">columns()</text>
  <text class="ms" x="758" y="221">schema() deprecated 3.4.0</text>

  <rect class="v1" x="60" y="250" width="470" height="52"/>
  <text class="m" x="76" y="272">buildScan() returns RDD&lt;Row&gt;</text>
  <text class="ms" x="76" y="292">connector builds the RDD</text>
  <path class="arw" d="M 536 276 L 654 276" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="250" width="480" height="52"/>
  <text class="m" x="676" y="272">ScanBuilder to Scan to Batch to PartitionReader</text>
  <text class="ms" x="676" y="292">connector describes, Spark executes</text>

  <rect class="v1" x="60" y="312" width="470" height="40"/>
  <text class="m" x="76" y="338">PrunedScan / PrunedFilteredScan</text>
  <path class="arw" d="M 536 332 L 654 332" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="312" width="480" height="40"/>
  <text class="ms" x="676" y="330">SupportsPushDownRequiredColumns</text>
  <text class="ms" x="676" y="346">SupportsPushDownFilters</text>

  <rect class="v1" x="60" y="362" width="470" height="40"/>
  <text class="m" x="76" y="388">unhandledFilters()</text>
  <path class="arw" d="M 536 382 L 654 382" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="362" width="480" height="40"/>
  <text class="m" x="676" y="383">return value of pushFilters()</text>
  <text class="ms" x="946" y="383">cannot drift</text>

  <rect class="v1" x="60" y="412" width="470" height="52"/>
  <text class="m" x="76" y="434">insert(data, overwrite)</text>
  <text class="ms" x="76" y="454">one call, no failure story</text>
  <path class="arw" d="M 536 438 L 654 438" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="412" width="480" height="52"/>
  <text class="m" x="676" y="434">WriteBuilder to BatchWrite to DataWriter</text>
  <text class="ms" x="676" y="454">two-phase commit, abort on failure</text>

  <rect class="v1" x="60" y="474" width="470" height="40"/>
  <text class="m" x="76" y="500">overwrite boolean</text>
  <path class="arw" d="M 536 494 L 654 494" marker-end="url(#a5)"/>
  <rect class="v2" x="660" y="474" width="480" height="40"/>
  <text class="m" x="676" y="500">SupportsTruncate capability</text>

  <rect class="v1" x="60" y="530" width="470" height="52" fill="#f4f5f7" stroke="#c3ccd6" stroke-width="1.2" rx="6" ry="6"/>
  <text class="note" x="76" y="552">no V1 equivalent</text>
  <text class="note" x="76" y="571">structurally impossible: V1 has no catalog</text>
  <path class="arw" d="M 536 556 L 654 556" marker-end="url(#a5)"/>
  <rect class="new" x="660" y="530" width="480" height="52"/>
  <text class="newt" x="676" y="551">TableCatalog, SupportsNamespaces,</text>
  <text class="newt" x="676" y="571">row-level DML, Changelog (CDC), transactions</text>

  <text class="cap" x="600" y="632" text-anchor="middle">Steps one to seven reach parity. The last row is why you migrate.</text>
</svg>
